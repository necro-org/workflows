name: Build and push docker image

on:
  workflow_call:
    inputs:
      image:
        description: "Image name (e.g. rice-and-beans-api)"
        required: true
        type: string
      context:
        description: "Docker build context (e.g. ./backend)"
        required: true
        type: string
      dockerfile:
        description: "Dockerfile path; defaults to <context>/Dockerfile"
        required: false
        type: string
        default: ""

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name and build time
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ inputs.image }}
        run: |
          echo "IMAGE_REF=ghcr.io/$(echo "$OWNER/$IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile || format('{0}/Dockerfile', inputs.context) }}
          push: true
          build-args: |
            APP_NAME=${{ inputs.image }}
            APP_VERSION=${{ github.run_number }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ env.BUILD_TIME }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ env.IMAGE_REF }}:latest
            ${{ env.IMAGE_REF }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}
